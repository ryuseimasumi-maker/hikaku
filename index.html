# hikaku
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>家具メモ — 比較ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F2ED;
  --surface: #FDFCFA;
  --surface2: #EFECE6;
  --border: #D8D2C8;
  --border2: #C4BDB0;
  --text: #1C1A17;
  --text2: #6B6560;
  --text3: #A09890;
  --accent: #3D6B4F;
  --accent-light: #EAF2EC;
  --accent2: #C4733A;
  --accent2-light: #FDF0E6;
  --danger: #B84040;
  --danger-light: #FBF0F0;
  --star-on: #D4922A;
  --star-off: #D8D2C8;
  --shadow: 0 2px 12px rgba(28,26,23,0.08);
  --shadow-lg: 0 8px 32px rgba(28,26,23,0.14);
  --radius: 16px;
  --radius-sm: 10px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Zen Kaku Gothic New', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
}

/* ── Header ── */
.header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px 12px;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.logo {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  color: var(--text);
  letter-spacing: -0.3px;
}
.logo span { color: var(--accent); }
.item-count {
  font-size: 12px;
  color: var(--text3);
  background: var(--surface2);
  padding: 3px 10px;
  border-radius: 20px;
}
.search-row {
  display: flex;
  gap: 8px;
}
.search-wrap {
  flex: 1;
  position: relative;
}
.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text3);
  font-size: 15px;
  pointer-events: none;
}
input[type=search] {
  width: 100%;
  height: 40px;
  padding: 0 12px 0 36px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
  font-family: inherit;
  font-size: 14px;
  color: var(--text);
  outline: none;
  -webkit-appearance: none;
}
input[type=search]:focus { border-color: var(--accent); }

/* ── Filter bar ── */
.filter-bar {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 16px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text2);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}
.chip.active {
  background: var(--text);
  color: var(--surface);
  border-color: var(--text);
}

/* ── Sort row ── */
.sort-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 16px 8px;
  font-size: 12px;
  color: var(--text3);
}
.sort-row select {
  font-family: inherit;
  font-size: 12px;
  color: var(--text2);
  border: none;
  background: transparent;
  outline: none;
  cursor: pointer;
}

/* ── Cards ── */
.cards {
  padding: 8px 16px 100px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

@media (min-width: 640px) {
  .cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    padding: 12px 20px 120px;
    gap: 16px;
  }
}
@media (min-width: 960px) {
  .cards { grid-template-columns: repeat(3, 1fr); }
}

.card {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  transition: transform 0.18s, box-shadow 0.18s;
}
.card:active { transform: scale(0.98); }

.card-thumb {
  width: 100%;
  height: 180px;
  background: var(--surface2);
  position: relative;
  overflow: hidden;
}
.card-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.thumb-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text3);
  font-size: 13px;
  flex-direction: column;
  gap: 6px;
}
.thumb-placeholder svg { opacity: 0.3; }
.score-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(28,26,23,0.82);
  color: #fff;
  border-radius: 10px;
  padding: 4px 10px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5px;
  backdrop-filter: blur(4px);
}
.cat-badge {
  position: absolute;
  bottom: 10px;
  left: 10px;
  background: var(--accent);
  color: #fff;
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 700;
}

.card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
.card-name { font-size: 15px; font-weight: 700; line-height: 1.4; }
.card-price { font-size: 13px; color: var(--accent2); font-weight: 700; }
.card-price.empty { color: var(--text3); font-weight: 400; }

/* stars */
.criteria-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.crit-item { display: flex; flex-direction: column; gap: 3px; }
.crit-label { font-size: 10px; color: var(--text3); letter-spacing: 0.3px; }
.stars { display: flex; gap: 3px; }
.star {
  font-size: 16px;
  cursor: pointer;
  color: var(--star-off);
  transition: color 0.1s, transform 0.1s;
  line-height: 1;
  padding: 2px;
}
.star:active { transform: scale(1.3); }
.star.on { color: var(--star-on); }

/* memo */
.memo-wrap { position: relative; }
.memo {
  width: 100%;
  font-family: inherit;
  font-size: 13px;
  line-height: 1.6;
  color: var(--text2);
  background: var(--surface2);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  resize: none;
  outline: none;
  min-height: 56px;
  transition: border-color 0.15s;
}
.memo::placeholder { color: var(--text3); }
.memo:focus { border-color: var(--accent); background: var(--surface); }

.card-footer {
  display: flex;
  gap: 6px;
  padding: 0 14px 12px;
}
.btn-edit {
  flex: 1;
  height: 38px;
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  background: transparent;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--text2);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-edit:active { background: var(--surface2); }
.btn-del {
  width: 38px;
  height: 38px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: transparent;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text3);
  transition: background 0.15s, color 0.15s;
}
.btn-del:active { background: var(--danger-light); color: var(--danger); }

/* ── FAB ── */
.fab {
  position: fixed;
  bottom: 24px;
  right: 20px;
  z-index: 40;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: var(--text);
  color: #fff;
  font-size: 26px;
  border: none;
  box-shadow: var(--shadow-lg);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.18s, background 0.18s;
}
.fab:active { transform: scale(0.92); background: var(--accent); }

/* ── Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(28,26,23,0.5);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s;
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}
.modal {
  width: 100%;
  max-width: 540px;
  background: var(--surface);
  border-radius: var(--radius) var(--radius) 0 0;
  padding: 0 0 env(safe-area-inset-bottom);
  max-height: 92dvh;
  overflow-y: auto;
  transform: translateY(30px);
  transition: transform 0.25s cubic-bezier(0.34,1.3,0.64,1);
  -webkit-overflow-scrolling: touch;
}
.modal-overlay.open .modal { transform: translateY(0); }

.modal-handle {
  width: 36px;
  height: 4px;
  background: var(--border2);
  border-radius: 2px;
  margin: 12px auto 0;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px 14px;
  border-bottom: 1px solid var(--border);
}
.modal-header h2 { font-size: 17px; font-weight: 700; }
.btn-close {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: var(--surface2);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text2);
}

.modal-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.field label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.8px;
  color: var(--text3);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.field input,
.field select,
.field textarea {
  width: 100%;
  font-family: inherit;
  font-size: 15px;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  outline: none;
  transition: border-color 0.15s;
  -webkit-appearance: none;
  appearance: none;
}
.field input:focus,
.field select:focus,
.field textarea:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.modal-footer {
  display: flex;
  gap: 10px;
  padding: 12px 20px 16px;
  border-top: 1px solid var(--border);
}
.btn-cancel {
  flex: 1;
  height: 48px;
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  background: transparent;
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  color: var(--text2);
  cursor: pointer;
}
.btn-save {
  flex: 2;
  height: 48px;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--text);
  color: #fff;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-save:active { background: var(--accent); }

/* ── Empty state ── */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text3);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.empty-icon { font-size: 48px; opacity: 0.4; }
.empty p { font-size: 14px; line-height: 1.7; }

/* ── Desktop centering ── */
@media (min-width: 960px) {
  .header { padding: 16px calc(50% - 460px); }
  .filter-bar { padding: 10px calc(50% - 460px); }
  .sort-row { padding: 0 calc(50% - 460px) 8px; }
  .cards { max-width: 960px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }
  .fab { right: calc(50% - 460px); }
  .modal-overlay { align-items: center; }
  .modal { border-radius: var(--radius); max-height: 85dvh; }
  .modal-handle { display: none; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <div class="logo">家具<span>メモ</span></div>
    <div class="item-count" id="count-label">0 件</div>
  </div>
  <div class="search-row">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="search" id="search" placeholder="商品名で検索..." oninput="render()">
    </div>
  </div>
</header>

<div class="filter-bar" id="filter-bar"></div>

<div class="sort-row">
  <span>並び替え：</span>
  <select id="sort" onchange="render()">
    <option value="added">追加順</option>
    <option value="score">スコア高い順</option>
    <option value="price_asc">価格安い順</option>
    <option value="price_desc">価格高い順</option>
  </select>
</div>

<div class="cards" id="cards"></div>

<button class="fab" onclick="openModal()" title="商品を追加">+</button>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h2 id="modal-title">商品を追加</h2>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>商品名 *</label>
        <input id="f-name" type="text" placeholder="例：IKEAソファ EKTORP">
      </div>
      <div class="field-row">
        <div class="field">
          <label>カテゴリ</label>
          <select id="f-cat">
            <option>ソファ</option>
            <option>テーブル・デスク</option>
            <option>チェア</option>
            <option>ベッド・マットレス</option>
            <option>収納・棚</option>
            <option>その他</option>
          </select>
        </div>
        <div class="field">
          <label>価格（円）</label>
          <input id="f-price" type="number" inputmode="numeric" placeholder="49800">
        </div>
      </div>
      <div class="field">
        <label>画像URL</label>
        <input id="f-img" type="url" placeholder="https://...">
      </div>
      <div class="field">
        <label>ショップ・購入先URL</label>
        <input id="f-link" type="url" placeholder="https://...">
      </div>
      <div class="field">
        <label>メモ</label>
        <textarea id="f-memo" placeholder="気になる点、実物確認済みなど..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-save" onclick="saveItem()">保存する</button>
    </div>
  </div>
</div>

<script>
const CATS = ['すべて','ソファ','テーブル・デスク','チェア','ベッド・マットレス','収納・棚','その他'];
const CRITERIA = ['デザイン','品質','コスパ','サイズ感'];

let items = [
  {id:1,name:'IKEA EKTORP 3人掛けソファ',cat:'ソファ',price:79900,img:'https://images.ikea.com/is/image/IKEA/EKTORP_3seat-sofa_s5/0938761_PE793296_S5.JPG',link:'https://www.ikea.com/jp/',memo:'ホワイト・ベージュが清潔感あり。カバー洗濯可能。',scores:{デザイン:4,品質:3,コスパ:5,サイズ感:3}},
  {id:2,name:'ニトリ Nポケット コイルソファ',cat:'ソファ',price:49900,img:'',link:'',memo:'座り心地は良いが耐久性が不安。',scores:{デザイン:3,品質:3,コスパ:4,サイズ感:4}},
  {id:3,name:'無印良品 ソファ・3シーター',cat:'ソファ',price:119000,img:'',link:'',memo:'シンプルで飽きない。値段が高め。',scores:{デザイン:5,品質:4,コスパ:3,サイズ感:4}}
];
let nextId = 10;
let editId = null;
let activeCat = 'すべて';

// ── Storage ──
function save() {
  try { localStorage.setItem('furniture_items', JSON.stringify(items)); } catch(e) {}
}
function load() {
  try {
    const d = localStorage.getItem('furniture_items');
    if(d) items = JSON.parse(d);
  } catch(e) {}
  if(items.length) nextId = Math.max(...items.map(i=>i.id)) + 1;
}

function totalScore(item) {
  const vals = Object.values(item.scores||{});
  if(!vals.length) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10;
}

// ── Filter chips ──
function renderChips() {
  document.getElementById('filter-bar').innerHTML = CATS.map(c=>
    `<button class="chip${activeCat===c?' active':''}" onclick="setcat('${c}')">${c}</button>`
  ).join('');
}
function setcat(c) { activeCat=c; render(); }

// ── Main render ──
function render() {
  renderChips();
  const q = document.getElementById('search').value.toLowerCase();
  const sort = document.getElementById('sort').value;
  let list = [...items];
  if(activeCat !== 'すべて') list = list.filter(i=>i.cat===activeCat);
  if(q) list = list.filter(i=>i.name.toLowerCase().includes(q)||i.cat.toLowerCase().includes(q));
  if(sort==='score') list.sort((a,b)=>(totalScore(b)||0)-(totalScore(a)||0));
  else if(sort==='price_asc') list.sort((a,b)=>(a.price||0)-(b.price||0));
  else if(sort==='price_desc') list.sort((a,b)=>(b.price||0)-(a.price||0));

  document.getElementById('count-label').textContent = list.length + ' 件';

  const el = document.getElementById('cards');
  if(!list.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🛋️</div><p>商品が見つかりません<br>右下の＋ボタンから追加してみましょう</p></div>`;
    return;
  }
  el.innerHTML = list.map(item => {
    const sc = totalScore(item);
    const priceStr = item.price ? '¥' + item.price.toLocaleString() : null;
    const thumbHtml = item.img
      ? `<img src="${item.img}" alt="${item.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : '';
    const placeholderStyle = item.img ? 'style="display:none"' : '';
    const scoreBadge = sc !== null ? `<div class="score-badge">${sc.toFixed(1)}</div>` : '';
    const linkBtn = item.link ? `<a href="${item.link}" target="_blank" style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--border);border-radius:10px;font-size:16px;text-decoration:none;color:var(--text2)" title="ショップへ">🔗</a>` : '';
    const starsHtml = CRITERIA.map(c=>`
      <div class="crit-item">
        <span class="crit-label">${c}</span>
        <div class="stars">${[1,2,3,4,5].map(n=>`<span class="star${(item.scores[c]||0)>=n?' on':''}" onclick="setStar(${item.id},'${c}',${n})">★</span>`).join('')}</div>
      </div>`).join('');
    return `<div class="card">
      <div class="card-thumb">
        ${thumbHtml}
        <div class="thumb-placeholder" ${placeholderStyle}>
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
          <span>画像なし</span>
        </div>
        ${scoreBadge}
        <div class="cat-badge">${item.cat}</div>
      </div>
      <div class="card-body">
        <div>
          <div class="card-name">${item.name}</div>
          ${priceStr ? `<div class="card-price">${priceStr}</div>` : `<div class="card-price empty">価格未設定</div>`}
        </div>
        <div class="criteria-grid">${starsHtml}</div>
        <textarea class="memo" placeholder="メモを入力..." onblur="saveMemo(${item.id},this)">${item.memo||''}</textarea>
      </div>
      <div class="card-footer">
        <button class="btn-edit" onclick="openModal(${item.id})">編集</button>
        ${linkBtn}
        <button class="btn-del" onclick="delItem(${item.id})" title="削除">🗑</button>
      </div>
    </div>`;
  }).join('');
}

function setStar(id,c,n) {
  const item = items.find(i=>i.id===id);
  if(!item) return;
  item.scores = item.scores || {};
  item.scores[c] = item.scores[c]===n ? 0 : n;
  save(); render();
}
function saveMemo(id,el) {
  const item = items.find(i=>i.id===id);
  if(item) { item.memo = el.value.trim(); save(); }
}
function delItem(id) {
  if(!confirm('この商品を削除しますか？')) return;
  items = items.filter(i=>i.id!==id);
  save(); render();
}

// ── Modal ──
function openModal(id=null) {
  editId = id;
  const m = id ? items.find(i=>i.id===id) : {};
  document.getElementById('modal-title').textContent = id ? '商品を編集' : '商品を追加';
  document.getElementById('f-name').value = m.name||'';
  document.getElementById('f-cat').value = m.cat||'ソファ';
  document.getElementById('f-price').value = m.price||'';
  document.getElementById('f-img').value = m.img||'';
  document.getElementById('f-link').value = m.link||'';
  document.getElementById('f-memo').value = m.memo||'';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-name').focus(), 300);
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editId = null;
}
function saveItem() {
  const name = document.getElementById('f-name').value.trim();
  if(!name) { alert('商品名を入力してください'); return; }
  const data = {
    name,
    cat: document.getElementById('f-cat').value,
    price: parseInt(document.getElementById('f-price').value)||0,
    img: document.getElementById('f-img').value.trim(),
    link: document.getElementById('f-link').value.trim(),
    memo: document.getElementById('f-memo').value.trim()
  };
  if(editId) {
    const item = items.find(i=>i.id===editId);
    Object.assign(item, data);
  } else {
    items.push({id: nextId++, scores: {}, ...data});
  }
  save(); closeModal(); render();
}

// init
load(); render();
</script>
</body>
</html>
